name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint and type tooling
        # openpyxl backs the XLSX path in validate_dataset.py; without it that
        # code path is unexercised and the spreadsheet claim is untested.
        run: pip install ruff mypy openpyxl
      # Discovery must run from the repository root: `-s tests` only resolves as a
      # path from here, and a stray top-level `tests` package in site-packages
      # would otherwise be discovered instead.
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Repository links and package inventory
        run: python tests/check_repository.py
      - name: Privacy audit
        run: python tests/audit_privacy.py
      - name: Ruff
        run: ruff check course-development-partner/scripts tests
      - name: MyPy
        run: mypy course-development-partner/scripts
