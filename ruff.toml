# Declare the lint rule set explicitly rather than inheriting whatever the
# installed ruff version happens to default to. Ruff's defaults expanded
# between 0.7 and 0.16, which turned a green gate red without a single commit
# to this repository — a check whose result depends on its install date is not
# a check. The workflow pins the version; this file pins the meaning.
#
# Selected: pyflakes (F) for real defects, the pycodestyle subsets ruff enables
# by default (E4 imports, E7 statements, E9 syntax/IO errors), and isort (I)
# because import order is mechanical and safely auto-fixed.
#
# Widening this set is a deliberate decision, not a side effect of upgrading.

[lint]
select = ["E4", "E7", "E9", "F", "I"]
